<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DragonBall OFFLINE</title>
  <!-- 网站 Favicon 图标 -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="shortcut icon" href="favicon.ico?v=2">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Share+Tech+Mono&family=Oswald:wght@600;700&display=swap');

    :root {
      --db-yellow: #ffcc00;
      --tv-blue-main: #1358b3;
      --tv-blue-dark: #0a336e;
      --tv-blue-light: #2d79de;
      --tv-cream-panel: #f2e6cb;
      --tv-screen-glass: #0b111a;
      --db-orange: #ff5400;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: var(--db-yellow);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.45) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.35) 0%, transparent 25%),
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(3px 3px at 40px 70px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 100% 100%, 100% 100%, 120px 120px, 160px 160px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 30px;
      user-select: none;
      overflow-x: hidden;
    }

    /* 顶部导航控制条 */
    .top-bar {
      width: min(96vw, 1320px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.25));
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      color: #111;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      background: #111;
      color: #fff;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 语言切换器 */
    .lang-selector {
      background: #ffffff;
      border: 2px solid #1a1a1a;
      color: #111;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 10px;
      border-radius: 50px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 3px 0 #1a1a1a;
      transition: all 0.1s ease;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      background: linear-gradient(180deg, #ff6a1a 0%, #e64200 100%);
      border: 2px solid #1a1a1a;
      border-radius: 50px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 3px 0 #1a1a1a;
      transition: all 0.1s ease;
      white-space: nowrap;
    }
    .btn-action:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .btn-action:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1a1a1a;
    }

    .btn-download {
      background: linear-gradient(180deg, #2b313a 0%, #171a1e 100%);
    }

    .btn-logout {
      background: #ffffff;
      color: #111;
      border: 2px solid #1a1a1a;
    }

    /* ================= 电视机机身主体 ================= */
    .tv-wrapper {
      width: min(96vw, 1320px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tv-chassis {
      width: 100%;
      aspect-ratio: 16 / 9.8;
      background: linear-gradient(180deg, var(--tv-blue-light) 0%, var(--tv-blue-main) 30%, var(--tv-blue-dark) 100%);
      border: 8px solid #072552;
      border-radius: 68px;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.4),
        inset 0 4px 8px rgba(255, 255, 255, 0.6),
        inset 0 -8px 16px rgba(0, 0, 0, 0.65);
      padding: 24px 26px 28px 26px;
      display: flex;
      gap: 24px;
      position: relative;
    }

    .tv-feet {
      width: 76%;
      display: flex;
      justify-content: space-between;
      margin-top: -3px;
      z-index: -1;
    }
    .tv-foot {
      width: 68px;
      height: 18px;
      background: #061936;
      border-radius: 0 0 14px 14px;
      box-shadow: 0 8px 12px rgba(0,0,0,0.5);
    }

    /* 左侧屏幕区 */
    .tv-crt-housing {
      flex: 2.85;
      height: 100%;
      background: linear-gradient(160deg, #30373f 0%, #15181c 25%, #08090b 100%);
      border-radius: 52px;
      border: 5px solid #060708;
      box-shadow: 
        inset 0 8px 16px rgba(255, 255, 255, 0.38),
        inset 10px 0 20px rgba(255, 255, 255, 0.1),
        inset 0 -14px 28px rgba(0, 0, 0, 0.95),
        0 2px 4px rgba(255, 255, 255, 0.25);
      padding: 20px;
      display: flex;
      position: relative;
    }

    .tv-screen-glass {
      width: 100%;
      height: 100%;
      background: var(--tv-screen-glass);
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 0 0 55px rgba(0, 0, 0, 0.98),
        inset 0 4px 8px rgba(255, 255, 255, 0.32),
        0 0 0 4px #040506;
    }

    .tv-screen-reflection {
      position: absolute;
      top: 3%;
      left: 7%;
      width: 86%;
      height: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.02) 60%, transparent 100%);
      border-radius: 50% 50% 45% 45%;
      filter: blur(2px);
      pointer-events: none;
      z-index: 10;
    }

    .tv-screen-glass::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 9;
    }

    .tv-standby-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #3e4854;
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
      padding: 10px;
    }
    .tv-standby-placeholder::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #1b242e;
      box-shadow: 0 0 12px #0a111a;
    }

    /* 右侧控制面板 */
    .tv-console-panel {
      flex: 1.15;
      height: 100%;
      background: linear-gradient(180deg, #fbf2dc 0%, var(--tv-cream-panel) 50%, #dbcca5 100%);
      border: 4px solid #2e261a;
      border-radius: 36px;
      box-shadow: 
        inset 0 3px 5px rgba(255, 255, 255, 0.9),
        inset 0 -5px 10px rgba(0, 0, 0, 0.28),
        0 3px 6px rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .console-segment-upper,
    .console-segment-middle {
      height: 33.3%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .console-segment-lower {
      height: 33.3%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 4px 6px;
    }

    .knob-assembly {
      position: relative;
      height: 94%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-svg-scale {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .dial-outer-wheel {
      width: 68%;
      height: 68%;
      border-radius: 50%;
      background: repeating-conic-gradient(#15181c 0% 1.2%, #242930 1.2% 2.4%);
      border: 3.5px solid #14171a;
      box-shadow: 
        0 6px 14px rgba(0, 0, 0, 0.5), 
        inset 0 1px 2px rgba(255, 255, 255, 0.35);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .dial-center-rotor {
      width: 68%;
      height: 68%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ede0c2 70%, #baa781 100%);
      box-shadow: 0 4px 9px rgba(0, 0, 0, 0.6), inset 0 1px 2px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1.5px solid #6b5f45;
    }

    .dial-grip-bar {
      width: 24%;
      height: 82%;
      background: linear-gradient(180deg, #ffffff 0%, #d8caa7 50%, #9e9172 100%);
      border-radius: 4px;
      border: 1px solid #5a503a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .dial-grip-bar::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 2px;
      right: 2px;
      height: 4px;
      background: #3b3223;
      border-radius: 1px;
    }

    .speaker-grille-box {
      width: 100%;
      height: 94%;
      background: #c8ba96;
      border: 2.5px solid #3d3424;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }
    .grille-slit {
      width: 100%;
      height: 7px;
      background: #18130a;
      border-radius: 3px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    /* =======================================================
       移动端 / 竖屏响应式适配 (Responsive Media Query)
       ======================================================= */
    @media (max-width: 768px) {
      body {
        padding: 12px 8px 24px;
      }

      /* 顶部导航：小屏转为上下两行排布 */
      .top-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .brand-section {
        justify-content: center;
      }
      .brand-title {
        font-size: 18px;
      }
      .nav-controls {
        justify-content: center;
        flex-wrap: wrap;
      }

      /* 电视机整体：取消横向固定比例，转为纵向自适应堆叠 */
      .tv-chassis {
        aspect-ratio: auto;
        flex-direction: column;
        border-radius: 40px;
        padding: 16px 14px 20px;
        gap: 16px;
      }

      /* 显像管屏幕：在手机上固定 4:3 复古屏幕比例 */
      .tv-crt-housing {
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        border-radius: 32px;
        padding: 12px;
      }
      .tv-screen-glass {
        border-radius: 24px;
      }
      .tv-standby-placeholder {
        font-size: 13px;
        letter-spacing: 1px;
      }

      /* 右侧控制面板：在手机端转到底部横向排布 */
      .tv-console-panel {
        width: 100%;
        height: 120px;
        flex-direction: row;
        border-radius: 24px;
        padding: 8px 12px;
        align-items: center;
      }

      .console-segment-upper,
      .console-segment-middle {
        width: 32%;
        height: 100%;
      }
      .console-segment-lower {
        width: 36%;
        height: 100%;
        padding: 6px;
      }

      .knob-assembly {
        height: 85%;
      }

      .speaker-grille-box {
        height: 85%;
        padding: 8px 10px;
      }
      .grille-slit {
        height: 5px;
      }

      .tv-feet {
        width: 82%;
      }
      .tv-foot {
        width: 50px;
        height: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <div class="top-bar">
    <div class="brand-section">
      <img src="favicon.ico?v=2" alt="Logo" class="brand-logo-img" onerror="this.style.display='none'">
      <div class="brand-title">
        <span class="brand-badge">DBO</span>
        <span>DragonBall OFFLINE</span>
      </div>
    </div>
    
    <div class="nav-controls">
      <!-- 多语言切换器 -->
      <select class="lang-selector" id="home-lang-switch" onchange="changeLanguage(this.value, true)">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="ja">日本語</option>
      </select>
      <div class="btn-group" id="nav-btn-slot"></div>
    </div>
  </div>

  <!-- 电视机主体 -->
  <div class="tv-wrapper">
    <div class="tv-chassis">
      
      <!-- 屏幕区 (小屏下居上，按 4:3 比例自适应撑开) -->
      <div class="tv-crt-housing">
        <div class="tv-screen-glass" id="tv-mount-point">
          <div class="tv-screen-reflection"></div>
          
          <div class="tv-standby-placeholder">
            <span>[ DBO CRT DISPLAY READY ]</span>
          </div>

        </div>
      </div>

      <!-- 控制面板 (小屏下居下，横向并排) -->
      <div class="tv-console-panel">
        
        <!-- 上旋钮 / 左旋钮 -->
        <div class="console-segment-upper">
          <div class="knob-assembly">
            <svg class="dial-svg-scale" viewBox="0 0 200 200">
              <g stroke="#261e12" stroke-width="2.2" stroke-linecap="round">
                <line x1="100" y1="28" x2="100" y2="34" />
                <line x1="68" y1="36" x2="72" y2="42" />
                <line x1="42" y1="56" x2="48" y2="61" />
                <line x1="30" y1="84" x2="36" y2="87" />
                <line x1="31" y1="114" x2="37" y2="111" />
                <line x1="45" y1="142" x2="51" y2="136" />
                <line x1="132" y1="36" x2="128" y2="42" />
                <line x1="158" y1="56" x2="152" y2="61" />
                <line x1="170" y1="84" x2="164" y2="87" />
                <line x1="169" y1="114" x2="163" y2="111" />
                <line x1="155" y1="142" x2="149" y2="136" />
              </g>
              <g font-family="Oswald, sans-serif" font-weight="700" fill="#241c10" text-anchor="middle" dominant-baseline="central">
                <text x="100" y="16" font-size="16" letter-spacing="1">OFF</text>
                <text x="62" y="26" font-size="12">5</text>
                <text x="32" y="47" font-size="12">6</text>
                <text x="18" y="80" font-size="12">3</text>
                <text x="18" y="114" font-size="12">2</text>
                <text x="32" y="146" font-size="12">0</text>
                <text x="138" y="26" font-size="12">7</text>
                <text x="168" y="47" font-size="12">8</text>
                <text x="184" y="80" font-size="11">19</text>
                <text x="184" y="114" font-size="11">19</text>
                <text x="168" y="146" font-size="12">0</text>
              </g>
            </svg>
            <div class="dial-outer-wheel">
              <div class="dial-center-rotor" style="transform: rotate(20deg);">
                <div class="dial-grip-bar"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 下旋钮 / 中旋钮 -->
        <div class="console-segment-middle">
          <div class="knob-assembly">
            <svg class="dial-svg-scale" viewBox="0 0 200 200">
              <g stroke="#261e12" stroke-width="2.2" stroke-linecap="round">
                <line x1="100" y1="28" x2="100" y2="34" />
                <line x1="68" y1="36" x2="72" y2="42" />
                <line x1="42" y1="56" x2="48" y2="61" />
                <line x1="30" y1="84" x2="36" y2="87" />
                <line x1="31" y1="114" x2="37" y2="111" />
                <line x1="45" y1="142" x2="51" y2="136" />
                <line x1="132" y1="36" x2="128" y2="42" />
                <line x1="158" y1="56" x2="152" y2="61" />
                <line x1="170" y1="84" x2="164" y2="87" />
                <line x1="169" y1="114" x2="163" y2="111" />
                <line x1="155" y1="142" x2="149" y2="136" />
              </g>
              <g font-family="Oswald, sans-serif" font-weight="700" fill="#241c10" text-anchor="middle" dominant-baseline="central">
                <text x="100" y="16" font-size="15" letter-spacing="1">VHF</text>
                <text x="62" y="26" font-size="12">5</text>
                <text x="32" y="47" font-size="12">4</text>
                <text x="18" y="80" font-size="12">2</text>
                <text x="18" y="114" font-size="12">1</text>
                <text x="32" y="146" font-size="12">0</text>
                <text x="138" y="26" font-size="12">1</text>
                <text x="168" y="47" font-size="11">18</text>
                <text x="184" y="80" font-size="11">19</text>
                <text x="184" y="114" font-size="11">13</text>
                <text x="168" y="146" font-size="11">10</text>
              </g>
            </svg>
            <div class="dial-outer-wheel">
              <div class="dial-center-rotor" style="transform: rotate(0deg);">
                <div class="dial-grip-bar"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 底部扬声器 / 右侧格栅 -->
        <div class="console-segment-lower">
          <div class="speaker-grille-box">
            <div class="grille-slit"></div>
            <div class="grille-slit"></div>
            <div class="grille-slit"></div>
            <div class="grille-slit"></div>
            <div class="grille-slit"></div>
            <div class="grille-slit"></div>
            <div class="grille-slit"></div>
          </div>
        </div>

      </div>

    </div>

    <!-- 底部支撑脚 -->
    <div class="tv-feet">
      <div class="tv-foot"></div>
      <div class="tv-foot"></div>
    </div>
  </div>

  <script>
    const i18n = {
      "zh-CN": {
        download: "下载游戏 ›",
        downloading: "客户端下载准备中...",
        gm_panel: "GM 控制台 ›",
        logout: "登出 ({user})",
        auth: "登录 / 注册 ›"
      },
      "zh-TW": {
        download: "下載遊戲 ›",
        downloading: "客戶端下載準備中...",
        gm_panel: "GM 控制台 ›",
        logout: "登出 ({user})",
        auth: "登入 / 註冊 ›"
      },
      en: {
        download: "Download Game ›",
        downloading: "Client download is being prepared...",
        gm_panel: "GM Console ›",
        logout: "Logout ({user})",
        auth: "Sign In / Register ›"
      },
      es: {
        download: "Descargar Juego ›",
        downloading: "Preparando descarga del cliente...",
        gm_panel: "Panel GM ›",
        logout: "Cerrar sesión ({user})",
        auth: "Iniciar Sesión / Registro ›"
      },
      pt: {
        download: "Baixar Jogo ›",
        downloading: "Preparando o download do cliente...",
        gm_panel: "Painel GM ›",
        logout: "Sair ({user})",
        auth: "Entrar / Cadastro ›"
      },
      ja: {
        download: "ゲームをダウンロード ›",
        downloading: "クライアントのダウンロードを準備中...",
        gm_panel: "GM管理パネル ›",
        logout: "ログアウト ({user})",
        auth: "ログイン / 新規登録 ›"
      }
    };

    function detectUserLanguage() {
      let savedLang = null;
      try { savedLang = localStorage.getItem('dbo_user_lang'); } catch (e) {}
      if (savedLang && i18n[savedLang]) return savedLang;

      let navLang = 'en';
      try { navLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase(); } catch (e) {}

      if (navLang.includes('tw') || navLang.includes('hk') || navLang.includes('mo') || navLang.includes('hant')) return 'zh-TW';
      if (navLang.startsWith('zh')) return 'zh-CN';
      if (navLang.startsWith('es')) return 'es';
      if (navLang.startsWith('pt')) return 'pt';
      if (navLang.startsWith('ja')) return 'ja';
      return 'en';
    }

    let currentLang = detectUserLanguage();

    function changeLanguage(lang, isManual = false) {
      currentLang = lang;
      if (isManual) {
        try { localStorage.setItem('dbo_user_lang', lang); } catch (e) {}
      }

      const selectElem = document.getElementById('home-lang-switch');
      if (selectElem) selectElem.value = lang;

      renderNav();
    }

    function renderNav() {
      const dict = i18n[currentLang] || i18n['en'];
      let token = null, user = null, role = null;
      try {
        token = localStorage.getItem('dbo_token');
        user = localStorage.getItem('dbo_user');
        role = localStorage.getItem('dbo_role');
      } catch (e) {}

      const slot = document.getElementById('nav-btn-slot');

      let html = '';
      html += `<a href="#" class="btn-action btn-download" onclick="alert('${dict.downloading}'); return false;">${dict.download}</a>`;

      if (token && user) {
        if (role === 'GM') {
          html += `<a href="login.html" class="btn-action">${dict.gm_panel}</a>`;
        }
        const logoutText = dict.logout.replace('{user}', user);
        html += `<button class="btn-action btn-logout" onclick="logout()">${logoutText}</button>`;
      } else {
        html += `<a href="login.html" class="btn-action">${dict.auth}</a>`;
      }

      slot.innerHTML = html;
    }

    function logout() {
      try {
        localStorage.removeItem('dbo_token');
        localStorage.removeItem('dbo_user');
        localStorage.removeItem('dbo_role');
      } catch (e) {}
      renderNav();
    }

    window.addEventListener('DOMContentLoaded', () => {
      changeLanguage(currentLang, false);
    });
  </script>
</body>
</html>
